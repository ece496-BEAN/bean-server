components:
  schemas:
    AuthToken:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        token:
          type: string
          readOnly: true
      required:
      - password
      - token
      - username
    Budget:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 255
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        budget_items:
          type: array
          items:
            $ref: '#/components/schemas/BudgetItem'
      required:
      - id
    BudgetItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        uuid:
          type: string
          format: uuid
          writeOnly: true
          nullable: true
        category:
          allOf:
          - $ref: '#/components/schemas/Category'
          readOnly: true
        category_uuid:
          type: string
          format: uuid
          writeOnly: true
        budget_id:
          type: string
          format: uuid
          readOnly: true
        allocation:
          type: number
          format: double
          maximum: 10000000000
          minimum: -10000000000
          exclusiveMaximum: true
          exclusiveMinimum: true
      required:
      - budget_id
      - category
      - category_uuid
      - id
    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 255
        is_income_type:
          type: boolean
        legacy:
          type: boolean
      required:
      - id
    DocumentScan:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        images:
          type: array
          items:
            $ref: '#/components/schemas/Image'
        ocr_result:
          type: string
      required:
      - id
      - ocr_result
    Image:
